<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="它一直在等一个人回头。" />
<meta property="og:title" content="别回头" />
<meta property="og:description" content="含突发惊吓与强光闪烁。" />
<title>别回头</title>
<link rel="stylesheet" href="style.css?v=13" />
<link rel="preload" as="image" href="img/clown.jpg" />
</head>
<body>

<div id="puppet">
  <div class="breath">
    <div class="parallax">
      <picture>
        <source media="(orientation: landscape)" srcset="img/clown_wide.jpg" />
        <img class="layer face" src="img/clown.jpg" alt="" draggable="false" />
      </picture>
      <picture>
        <source media="(orientation: landscape)" srcset="img/eyes_wide.jpg" />
        <img class="layer eyes" src="img/eyes.jpg" alt="" draggable="false" />
      </picture>
      <div class="slices" id="slices"></div>
      <div class="tear" id="tear"></div>
    </div>
    <div class="dimmer" id="dimmer"></div>
  </div>
</div>

<canvas id="fx"></canvas>
<canvas id="grain"></canvas>
<div id="scan"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="blood"></div>

<div id="know">
  <p class="k1"></p>
  <p class="k2"></p>
  <p class="k3"></p>
</div>

<div id="crash">
  <pre id="crashlog"></pre>
  <div class="snap">
    <svg viewBox="0 0 24 24" width="82" height="82" aria-hidden="true">
      <rect x="2.6" y="1.8" width="18.8" height="20.4" rx="2.6" fill="#dcdfe4" />
      <circle cx="9.1" cy="9.9" r="1.4" fill="#fff" />
      <circle cx="14.9" cy="9.9" r="1.4" fill="#fff" />
      <path d="M8.3 15.2Q12 17.7 15.7 15.2" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </svg>
    <p class="ct">噢，崩溃啦！</p>
    <p class="cs">显示此网页时出现问题。</p>
    <p class="cc">错误代码：STATUS_BREAKPOINT</p>
    <button class="cb" type="button">重新加载</button>
  </div>
</div>

<div id="eyeShot">
  <picture>
    <source media="(orientation: landscape)" srcset="img/eyes_close.jpg" />
    <img src="img/eyes_close_v.jpg" alt="" draggable="false" />
  </picture>
</div>

<div id="dot"></div>

<div id="end">
  <p class="l1">它记住你了</p>
  <p class="l2">你已经回头了</p>
  <button id="again" type="button">再 看 一 次</button>
  <p class="l3">含突发惊吓 · 强光闪烁 · 请勿给心脏不适者观看</p>
</div>

<button id="exit" type="button" aria-label="退出"></button>

<script src="fx.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
